name: Build (Windows / macOS / Linux)

# 手動実行 or タグ push (v*) で走る
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon (M1/M2/M3…) 向け
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          # Intel Mac 向け
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
          # Windows
          - platform: windows-latest
            args: ''
          # Linux
          - platform: ubuntu-22.04
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libudev-dev

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # macOS は両アーキテクチャのターゲットを追加
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install npm deps
        run: npm ci

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}

      # No artifact upload: on a public repository anyone who can see a run can
      # download its artifacts, and desktop builds are deliberately not
      # distributed from here (people fork and build their own). This workflow
      # stays as a check that the desktop app still compiles on all three
      # platforms.
