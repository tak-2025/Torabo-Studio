name: Deploy web version to GitHub Pages

# The desktop release workflow (build.yml) is untouched by this: it builds the
# Tauri app on tag pushes, this publishes the browser build of the same source.
on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

# Let a run finish rather than cancelling it mid-deploy; queue the next one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      # No separate type-check step: `npm run build` is
      # `generate-data && tsc && vite build`, and tsc has to run AFTER
      # generate-data — src/data/release-data.json is generated, not committed,
      # so type-checking first fails on a missing module.
      - name: Build
        # Project site => served from /<repo>/, so assets need that prefix.
        run: npm run build
        env:
          PAGES_BASE: /${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
